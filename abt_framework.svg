<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="790" viewBox="0 0 1200 790" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="k" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#333"/></marker>
    <marker id="r" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#c0392b"/></marker>
    <marker id="g" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#2e8b57"/></marker>
    <marker id="b" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#2c6fbb"/></marker>
  </defs>
  <rect width="1200" height="790" fill="#fff"/>
  <text x="600" y="28" text-anchor="middle" font-size="22" font-weight="bold">ABT: Automated Blue Teaming vs. Autonomous Red Teaming</text>

  <!-- RED TEAM -->
  <rect x="40" y="45" width="1120" height="110" rx="12" fill="#fdecea" stroke="#c0392b" stroke-width="2.5"/>
  <text x="60" y="70" font-size="16" font-weight="bold" fill="#c0392b">RED TEAM (autonomous pen-testing agents)</text>
  <g font-size="13" text-anchor="middle">
    <rect x="70" y="85" width="170" height="52" rx="8" fill="#fff" stroke="#c0392b"/><text x="155" y="116">Incalmo</text>
    <rect x="270" y="85" width="170" height="52" rx="8" fill="#fff" stroke="#c0392b"/><text x="355" y="116">APT-Agent</text>
    <rect x="470" y="85" width="170" height="52" rx="8" fill="#fff" stroke="#c0392b"/><text x="555" y="116">AutoHacker</text>
    <rect x="860" y="85" width="270" height="52" rx="8" fill="#fff" stroke="#c0392b" stroke-width="2"/>
    <text x="995" y="107" font-weight="bold">Attacker goal</text>
    <text x="995" y="125" font-size="11">e.g. exfiltrate data on DB / root on AD</text>
  </g>

  <!-- TARGET NETWORK -->
  <rect x="40" y="215" width="1120" height="170" rx="12" fill="#f4f9f1" stroke="#2e8b57" stroke-width="2.5"/>
  <text x="60" y="240" font-size="16" font-weight="bold" fill="#2e8b57">TARGET NETWORK (to protect)</text>
  <g font-size="13" text-anchor="middle">
    <rect x="70" y="265" width="130" height="62" rx="8" fill="#fff" stroke="#2e8b57"/><text x="135" y="291" font-weight="bold">Web (DMZ)</text><text x="135" y="311" font-size="11">entry point</text>
    <rect x="260" y="265" width="130" height="62" rx="8" fill="#fff" stroke="#2e8b57"/><text x="325" y="291" font-weight="bold">App server</text><text x="325" y="311" font-size="11">services + vulns</text>
    <rect x="450" y="265" width="130" height="62" rx="8" fill="#fff" stroke="#c0392b" stroke-width="2.5"/><text x="515" y="291" font-weight="bold">DB ★</text><text x="515" y="311" font-size="11" fill="#c0392b">crown-jewel asset</text>
    <rect x="640" y="265" width="130" height="62" rx="8" fill="#fff" stroke="#2e8b57"/><text x="705" y="291" font-weight="bold">File server</text><text x="705" y="311" font-size="11">services + vulns</text>
    <rect x="830" y="265" width="130" height="62" rx="8" fill="#fff" stroke="#2e8b57"/><text x="895" y="291" font-weight="bold">AD / LDAP</text><text x="895" y="311" font-size="11">privilege asset</text>
    <rect x="1000" y="265" width="140" height="62" rx="8" fill="#fff" stroke="#888" stroke-dasharray="4,3"/><text x="1070" y="291" font-weight="bold">Legit users</text><text x="1070" y="311" font-size="11">need avail./perf.</text>
  </g>
  <!-- MIR badges -->
  <g font-size="10" font-weight="bold" fill="#fff" text-anchor="middle">
    <rect x="70" y="256" width="34" height="15" rx="4" fill="#2e8b57"/><text x="87" y="267">MIR</text>
    <rect x="260" y="256" width="34" height="15" rx="4" fill="#2e8b57"/><text x="277" y="267">MIR</text>
    <rect x="450" y="256" width="34" height="15" rx="4" fill="#2e8b57"/><text x="467" y="267">MIR</text>
    <rect x="640" y="256" width="34" height="15" rx="4" fill="#2e8b57"/><text x="657" y="267">MIR</text>
    <rect x="830" y="256" width="34" height="15" rx="4" fill="#2e8b57"/><text x="847" y="267">MIR</text>
  </g>
  <!-- attack path inside network -->
  <line x1="200" y1="296" x2="258" y2="296" stroke="#c0392b" stroke-width="2.5" marker-end="url(#r)"/>
  <line x1="390" y1="296" x2="448" y2="296" stroke="#c0392b" stroke-width="2.5" marker-end="url(#r)"/>
  <path d="M 580 296 L 638 296" stroke="#999" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#k)"/>
  <path d="M 770 296 L 828 296" stroke="#999" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#k)"/>
  <text x="600" y="365" text-anchor="middle" font-size="11" fill="#555">network controller: topology · firewall/segmentation · service composition · IP/port shuffling</text>

  <!-- Red -> target -->
  <line x1="135" y1="155" x2="135" y2="263" stroke="#c0392b" stroke-width="3" stroke-dasharray="7,4" marker-end="url(#r)"/>
  <text x="145" y="195" font-size="12" fill="#c0392b" font-weight="bold">A. attacks</text>
  <text x="145" y="210" font-size="11" fill="#c0392b">exploit · lateral move · exfiltrate</text>

  <!-- BLUE TEAM -->
  <rect x="40" y="450" width="1120" height="300" rx="12" fill="#eaf2fb" stroke="#2c6fbb" stroke-width="2.5"/>
  <text x="60" y="475" font-size="16" font-weight="bold" fill="#2c6fbb">BLUE TEAM: ABT (Automated Blue Teaming), left-to-right pipeline</text>

  <g font-size="12" text-anchor="middle">
    <g>
      <rect x="60" y="500" width="165" height="120" rx="10" fill="#fff" stroke="#2c6fbb" stroke-width="2"/>
      <circle cx="82" cy="505" r="15" fill="#2c6fbb"/><text x="82" y="510" fill="#fff" font-size="14" font-weight="bold">1</text>
      <text x="142" y="528" font-weight="bold" font-size="13">Asset &amp; protection</text>
      <text x="142" y="548" font-size="11">assets, value, C/I/A</text>
      <text x="142" y="564" font-size="11">min availability</text>
      <text x="142" y="580" font-size="11">min performance</text>
      <text x="142" y="596" font-size="11">legit workflows</text>
    </g>
    <g>
      <rect x="250" y="500" width="165" height="120" rx="10" fill="#fff" stroke="#2c6fbb" stroke-width="2"/>
      <circle cx="272" cy="505" r="15" fill="#2c6fbb"/><text x="272" y="510" fill="#fff" font-size="14" font-weight="bold">2</text>
      <text x="332" y="528" font-weight="bold" font-size="13">MIR agents (host)</text>
      <text x="332" y="548" font-size="11">monitor · identify</text>
      <text x="332" y="564" font-size="11">respond: patch, kill,</text>
      <text x="332" y="580" font-size="11">disable svc, isolate,</text>
      <text x="332" y="596" font-size="11">diversify</text>
    </g>
    <g>
      <rect x="440" y="500" width="165" height="120" rx="10" fill="#fff" stroke="#2c6fbb" stroke-width="2"/>
      <circle cx="462" cy="505" r="15" fill="#2c6fbb"/><text x="462" y="510" fill="#fff" font-size="14" font-weight="bold">3</text>
      <text x="522" y="528" font-weight="bold" font-size="13">Network control</text>
      <text x="522" y="548" font-size="11">topology, connections</text>
      <text x="522" y="564" font-size="11">segmentation / firewall</text>
      <text x="522" y="580" font-size="11">service composition</text>
      <text x="522" y="596" font-size="11">IP/port shuffling (MTD)</text>
    </g>
    <g>
      <rect x="630" y="500" width="165" height="120" rx="10" fill="#fff" stroke="#2c6fbb" stroke-width="2"/>
      <circle cx="652" cy="505" r="15" fill="#2c6fbb"/><text x="652" y="510" fill="#fff" font-size="14" font-weight="bold">4</text>
      <text x="712" y="528" font-weight="bold" font-size="13">Attack graph</text>
      <text x="712" y="548" font-size="11">network-wide HARM from</text>
      <text x="712" y="564" font-size="11">topology + services +</text>
      <text x="712" y="580" font-size="11">vulns + deployed controls</text>
      <text x="712" y="596" font-size="11">entry points → assets</text>
    </g>
    <g>
      <rect x="820" y="500" width="165" height="120" rx="10" fill="#fff" stroke="#2c6fbb" stroke-width="2"/>
      <circle cx="842" cy="505" r="15" fill="#2c6fbb"/><text x="842" y="510" fill="#fff" font-size="14" font-weight="bold">5</text>
      <text x="902" y="528" font-weight="bold" font-size="13">Goal capture</text>
      <text x="902" y="548" font-size="11">map attacker goal onto</text>
      <text x="902" y="564" font-size="11">the graph → critical</text>
      <text x="902" y="580" font-size="11">attack paths + risk</text>
      <text x="902" y="596" font-size="11">per asset</text>
    </g>
    <g>
      <rect x="1010" y="500" width="130" height="120" rx="10" fill="#2c6fbb" stroke="#1d4f8a" stroke-width="2"/>
      <circle cx="1032" cy="505" r="15" fill="#fff" stroke="#2c6fbb"/><text x="1032" y="510" fill="#2c6fbb" font-size="14" font-weight="bold">6</text>
      <text x="1075" y="528" font-weight="bold" font-size="13" fill="#fff">Master agent</text>
      <text x="1075" y="548" font-size="11" fill="#fff">plan actions</text>
      <text x="1075" y="564" font-size="11" fill="#fff">simulate + evaluate</text>
      <text x="1075" y="580" font-size="11" fill="#fff">security · avail. · perf.</text>
      <text x="1075" y="596" font-size="11" fill="#fff">→ best-utility set</text>
    </g>
  </g>
  <!-- pipeline arrows -->
  <g stroke="#2c6fbb" stroke-width="2.5" marker-end="url(#b)">
    <line x1="226" y1="560" x2="248" y2="560"/>
    <line x1="416" y1="560" x2="438" y2="560"/>
    <line x1="606" y1="560" x2="628" y2="560"/>
    <line x1="796" y1="560" x2="818" y2="560"/>
    <line x1="986" y1="560" x2="1008" y2="560"/>
  </g>

  <!-- Feedback loop: master -> execute -->
  <path d="M 1075 622 L 1075 665 L 395 665 L 395 622" fill="none" stroke="#2c6fbb" stroke-width="2.5" marker-end="url(#b)"/>
  <text x="735" y="685" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c6fbb">7. execute approved defence actions via MIR agents (2) and network controller (3), then re-plan (closed loop)</text>
  <text x="735" y="705" text-anchor="middle" font-size="11" fill="#555">(optional human approval gate · simulation runs on a model copy, never on the live network)</text>
  <text x="600" y="735" text-anchor="middle" font-size="11" fill="#555">Evaluation: ABT is validated by re-running the red-team tools before/after the plan; goal success rate vs. legitimate-user availability/performance.</text>

  <!-- Blue -> target: actions (blue), Target -> blue: telemetry (green) -->
  <line x1="300" y1="498" x2="300" y2="387" stroke="#2c6fbb" stroke-width="2.5" marker-end="url(#b)"/>
  <line x1="365" y1="387" x2="365" y2="498" stroke="#2e8b57" stroke-width="2.5" stroke-dasharray="6,3" marker-end="url(#g)"/>
  <line x1="490" y1="498" x2="490" y2="387" stroke="#2c6fbb" stroke-width="2.5" marker-end="url(#b)"/>
  <line x1="555" y1="387" x2="555" y2="498" stroke="#2e8b57" stroke-width="2.5" stroke-dasharray="6,3" marker-end="url(#g)"/>
  <text x="298" y="425" text-anchor="end" font-size="11" fill="#2c6fbb" font-weight="bold">B. host defence</text>
  <text x="367" y="425" font-size="11" fill="#2e8b57" font-weight="bold">C. alerts,</text>
  <text x="367" y="439" font-size="11" fill="#2e8b57" font-weight="bold">host state</text>
  <text x="488" y="425" text-anchor="end" font-size="11" fill="#2c6fbb" font-weight="bold">B. network</text>
  <text x="488" y="439" text-anchor="end" font-size="11" fill="#2c6fbb" font-weight="bold">defence</text>
  <text x="557" y="425" font-size="11" fill="#2e8b57" font-weight="bold">C. topology,</text>
  <text x="557" y="439" font-size="11" fill="#2e8b57" font-weight="bold">services, vulns</text>

  <!-- Goal -> step 5 -->
  <path d="M 1130 138 L 1178 138 L 1178 428 L 902 428 L 902 498" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="3,3" marker-end="url(#r)"/>
  <text x="1170" y="420" text-anchor="end" font-size="11" fill="#c0392b" font-weight="bold">D. goal known / assumed (Incalmo-style)</text>

  <!-- Legend -->
  <g font-size="11">
    <line x1="720" y1="410" x2="750" y2="410" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="7,4"/><text x="756" y="414">attack</text>
    <line x1="720" y1="426" x2="750" y2="426" stroke="#2c6fbb" stroke-width="2.5"/><text x="756" y="430">defence action</text>
    <line x1="720" y1="442" x2="750" y2="442" stroke="#2e8b57" stroke-width="2.5" stroke-dasharray="6,3"/><text x="756" y="446">observation</text>
  </g>
</svg>
