<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="900" viewBox="0 0 1100 900"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs><rect width="1100" height="900" fill="white"/><text x="550" y="30" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#243349" font-weight="bold" text-anchor="middle">Automated Blue Teaming: A General Closed-Loop Procedure</text><rect x="24" y="52" width="1052" height="128" rx="10" fill="#fff4f1" stroke="#b65040" stroke-width="1.8"/><text x="44" y="78" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#a43a2b" font-weight="bold" text-anchor="start">AUTONOMOUS RED TEAM</text><rect x="44" y="92" width="238" height="68" rx="6" fill="white" stroke="#d7aba2" stroke-width="1.8"/><text x="163" y="117" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#243349" font-weight="bold" text-anchor="middle">Reconnaissance</text><text x="163" y="142" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#243349" font-weight="normal" text-anchor="middle">Discover accessible resources</text><rect x="302" y="92" width="238" height="68" rx="6" fill="white" stroke="#d7aba2" stroke-width="1.8"/><text x="421" y="117" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#243349" font-weight="bold" text-anchor="middle">Attack planning</text><text x="421" y="142" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#243349" font-weight="normal" text-anchor="middle">Select paths and objectives</text><rect x="560" y="92" width="238" height="68" rx="6" fill="white" stroke="#d7aba2" stroke-width="1.8"/><text x="679" y="117" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#243349" font-weight="bold" text-anchor="middle">Attack execution</text><text x="679" y="142" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#243349" font-weight="normal" text-anchor="middle">Exploit and move laterally</text><rect x="818" y="92" width="238" height="68" rx="6" fill="white" stroke="#d7aba2" stroke-width="1.8"/><text x="937" y="117" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#243349" font-weight="bold" text-anchor="middle">Goal pursuit</text><text x="937" y="142" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#243349" font-weight="normal" text-anchor="middle">Access, exfiltrate or disrupt</text><path d="M284,126 L300,126" fill="none" stroke="#b65040" stroke-width="2.3" marker-end="url(#arrow)"/><path d="M542,126 L558,126" fill="none" stroke="#b65040" stroke-width="2.3" marker-end="url(#arrow)"/><path d="M800,126 L816,126" fill="none" stroke="#b65040" stroke-width="2.3" marker-end="url(#arrow)"/><path d="M150,180 L150,229" fill="none" stroke="#b65040" stroke-width="2.3" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="170" y="210" font-family="DejaVu Sans, sans-serif" font-size="14" fill="#a43a2b" font-weight="normal" text-anchor="start">Attack attempts</text><rect x="24" y="230" width="1052" height="210" rx="10" fill="#f2f8f4" stroke="#438364" stroke-width="1.8"/><text x="44" y="257" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#306849" font-weight="bold" text-anchor="start">TARGET NETWORK: INTERCONNECTED HOSTS, SERVICES AND ASSETS</text><rect x="55" y="280" width="290" height="77" rx="6" fill="white" stroke="#80ab94" stroke-width="1.8"/><text x="200" y="310" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#243349" font-weight="bold" text-anchor="middle">Access / edge zone</text><text x="200" y="338" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#243349" font-weight="normal" text-anchor="middle">Entry points and gateways</text><rect x="405" y="280" width="290" height="77" rx="6" fill="white" stroke="#80ab94" stroke-width="1.8"/><text x="550" y="310" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#243349" font-weight="bold" text-anchor="middle">Internal network zone</text><text x="550" y="338" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#243349" font-weight="normal" text-anchor="middle">Endpoints and services</text><rect x="755" y="280" width="290" height="77" rx="6" fill="white" stroke="#80ab94" stroke-width="1.8"/><text x="900" y="310" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#243349" font-weight="bold" text-anchor="middle">Protected resource zone</text><text x="900" y="338" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#243349" font-weight="normal" text-anchor="middle">Data and critical assets</text><path d="M345,319 L405,319" fill="none" stroke="#438364" stroke-width="2.3" marker-end="url(#arrow)"/><path d="M695,319 L755,319" fill="none" stroke="#438364" stroke-width="2.3" marker-end="url(#arrow)"/><text x="550" y="388" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#243349" font-weight="normal" text-anchor="middle">Host and network sensors  |  Configurable enforcement points</text><text x="550" y="417" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#243349" font-weight="normal" text-anchor="middle">Legitimate workloads and service dependencies are preserved</text><path d="M235,440 L235,498" fill="none" stroke="#438364" stroke-width="2.3" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="255" y="475" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#306849" font-weight="normal" text-anchor="start">Telemetry and state</text><text x="865" y="475" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#2764a0" font-weight="normal" text-anchor="end">Defence actions</text><rect x="24" y="498" width="1052" height="340" rx="10" fill="#eff5fc" stroke="#3676b2" stroke-width="1.8"/><text x="44" y="525" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#2764a0" font-weight="bold" text-anchor="start">BLUE TEAM: ITERATIVE DEFENCE PROCEDURE</text><rect x="50" y="548" width="290" height="108" rx="7" fill="white" stroke="#7ea6cc" stroke-width="1.8"/><text x="195" y="577" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#243349" font-weight="bold" text-anchor="middle">1. Define requirements</text><text x="195" y="605" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#243349" font-weight="normal" text-anchor="middle">Identify assets and value</text><text x="195" y="628" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#243349" font-weight="normal" text-anchor="middle">Set security and service constraints</text><rect x="405" y="548" width="290" height="108" rx="7" fill="white" stroke="#7ea6cc" stroke-width="1.8"/><text x="550" y="577" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#243349" font-weight="bold" text-anchor="middle">2. Observe network state</text><text x="550" y="605" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#243349" font-weight="normal" text-anchor="middle">Collect host and network telemetry</text><text x="550" y="628" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#243349" font-weight="normal" text-anchor="middle">Update configuration and alerts</text><rect x="760" y="548" width="290" height="108" rx="7" fill="white" stroke="#7ea6cc" stroke-width="1.8"/><text x="905" y="577" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#243349" font-weight="bold" text-anchor="middle">3. Model threats and goals</text><text x="905" y="605" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#243349" font-weight="normal" text-anchor="middle">Build or update attack graphs</text><text x="905" y="628" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#243349" font-weight="normal" text-anchor="middle">Assess paths and asset-level risk</text><rect x="760" y="692" width="290" height="108" rx="7" fill="white" stroke="#7ea6cc" stroke-width="1.8"/><text x="905" y="721" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#243349" font-weight="bold" text-anchor="middle">4. Plan candidate defences</text><text x="905" y="749" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#243349" font-weight="normal" text-anchor="middle">Select host and network controls</text><text x="905" y="772" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#243349" font-weight="normal" text-anchor="middle">Include adaptive / MTD actions</text><rect x="405" y="692" width="290" height="108" rx="7" fill="white" stroke="#7ea6cc" stroke-width="1.8"/><text x="550" y="721" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#243349" font-weight="bold" text-anchor="middle">5. Simulate and evaluate</text><text x="550" y="749" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#243349" font-weight="normal" text-anchor="middle">Estimate risk, service impact and cost</text><text x="550" y="772" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#243349" font-weight="normal" text-anchor="middle">Choose a feasible defence plan</text><rect x="50" y="692" width="290" height="108" rx="7" fill="white" stroke="#7ea6cc" stroke-width="1.8"/><text x="195" y="721" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#243349" font-weight="bold" text-anchor="middle">6. Apply, measure and adapt</text><text x="195" y="749" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#243349" font-weight="normal" text-anchor="middle">Enforce approved actions</text><text x="195" y="772" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#243349" font-weight="normal" text-anchor="middle">Use observed outcomes to re-plan</text><path d="M340,602 L405,602" fill="none" stroke="#2764a0" stroke-width="2.3" marker-end="url(#arrow)"/><path d="M695,602 L760,602" fill="none" stroke="#2764a0" stroke-width="2.3" marker-end="url(#arrow)"/><path d="M905,656 L905,692" fill="none" stroke="#2764a0" stroke-width="2.3" marker-end="url(#arrow)"/><path d="M760,746 L695,746" fill="none" stroke="#2764a0" stroke-width="2.3" marker-end="url(#arrow)"/><path d="M405,746 L340,746" fill="none" stroke="#2764a0" stroke-width="2.3" marker-end="url(#arrow)"/><path d="M195,692 L195,675 L550,675 L550,656" fill="none" stroke="#2764a0" stroke-width="2.3" marker-end="url(#arrow)"/><text x="353" y="670" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#2764a0" font-weight="normal" text-anchor="middle">Feedback / repeat</text><path d="M50,746 L38,746 L38,826 L1063,826 L1063,488 L885,488 L885,440" fill="none" stroke="#2764a0" stroke-width="2.3" marker-end="url(#arrow)"/><text x="550" y="864" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#243349" font-weight="normal" text-anchor="middle">Evaluation: attacker goal success, legitimate-service availability, performance and defence cost</text><text x="550" y="889" font-family="DejaVu Sans, sans-serif" font-size="14" fill="#526176" font-weight="normal" text-anchor="middle">Conceptual workflow; specific tools, topology and deployment adapters are interchangeable.</text></svg>